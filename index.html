<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=4" />
    <link rel="shortcut icon" href="/favicon.ico?v=4" />
    <link rel="apple-touch-icon" href="/logo.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9fb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error("Global Error Caught:", msg, url, lineNo);
        var errDiv = document.getElementById('app-error-log');
        if (errDiv) {
          errDiv.style.display = 'block';
          errDiv.innerText = "App Error: " + msg;
        }
        return false;
      };
    </script>
  </head>
  <body>
    <div id="app-error-log" style="display:none; padding:15px; background:#fee2e2; color:#991b1b; font-family:sans-serif; text-align:center;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
